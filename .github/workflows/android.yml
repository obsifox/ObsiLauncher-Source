name: Android

# ObsiLauncher for Android — a standalone app written from scratch (no upstream overlay).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the APK to the rolling 'nightly' pre-release"
        type: boolean
        required: false
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK (arm64-v8a)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ObsiLauncher-android-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Attach to rolling nightly
        if: inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          files: android/app/build/outputs/apk/release/*.apk
